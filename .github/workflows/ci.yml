name: CI
on: [push, pull_request]
#  schedule:
#    - cron: '0 0-23/4 * * *'
permissions:
  contents: read
jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            triplet: x64-windows
            configFlags: --enable-discord --enable-faad --enable-gif --enable-mikmod --enable-mpeg2 --enable-vpx
    env:
      CONFIGURATION: Release
      CCACHE_PATH: C:\\Users\\runneradmin\\.cargo\\bin
      PLATFORM: ${{ matrix.platform }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      GIT_VCPKG_COMMIT: b02e341c927f16d991edbd915d8ea43eac52096c
    permissions:
      contents: write # For dependencygraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup nasm
        uses: ilammy/setup-nasm@v1
        if: matrix.useNasm == 'true'
      - name: Force CMake < 4.0 usage
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'
      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: win-${{ matrix.platform }}
          max-size: 1G
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}
      - name: Integrate vcpkg
        run: |
          ${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/vcpkg integrate install
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg_installed/compiler-file-hash-cache.json', 'vcpkg_installed/status') }}
          restore-keys: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-${{ matrix.triplet }}-
      - name: Build create_project
        run: |
          cd devtools/create_project/cmake
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .
          cmake --build . -j 2
          ls
          cd ../../../
      - name: Call create_project
        run: |
          mkdir build-scummvm
          cd build-scummvm
          ../devtools/create_project/cmake/Debug/create_project.exe .. --msvc --vcpkg --disable-all-engines ${{ matrix.configFlags }}
          ls
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Add VS Tools to PATH
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - name: Symlink ccache
        run: |
          Copy-Item "${{ env.CCACHE_PATH }}\\ccache.exe" -Destination "${{ env.CCACHE_PATH }}\\cl.exe"
      - name: Build scummvm
        run: |
          cd build-scummvm
          ls
          ls ${{ env.CCACHE_PATH }}
          echo $env:path
          msbuild scummvm.sln /m /p:VcpkgEnableManifest=true /p:BuildInParallel=true /p:Configuration=${{ env.CONFIGURATION }} /p:PreferredToolArchitecture=x64 /p:Platform=${{ matrix.platform }} /v:minimal /p:CLToolPath=${{ env.CCACHE_PATH }}
      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg_installed/compiler-file-hash-cache.json', 'vcpkg_installed/status') }}
      - name: Upload libs
        uses: actions/upload-artifact@v4
        if: matrix.buildArtifacts == 'true'
        with:
          name: libs-${{ matrix.triplet }}
          path: ${{ env.VCPKG_INSTALLED_DIR }}\\${{ matrix.triplet }}
